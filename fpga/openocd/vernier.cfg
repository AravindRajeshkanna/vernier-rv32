# OpenOCD for this SoC's debug path.
#
# **Untested.** No adapter has been connected to a board; the path is proven
# in simulation by `make sim_jtag` and nothing more. This file exists so the
# first person to try it starts from something considered rather than from a
# blank page, and every value in it is one `rtl/debug/` actually implements.
#
# ---- Read this before you expect gdb to work ----
#
# The Debug Module implements **System Bus Access only**. It cannot halt the
# hart, read its registers, or set a breakpoint - see rtl/debug/README.md for
# why that half first. So OpenOCD will not drive this as a normal RISC-V
# target: `targets` will show a hart that never halts, and `gdb` attached to
# it will sit waiting for a halt that cannot come.
#
# What it *can* do is memory, and that is most of what has been wanted here:
#
#   > riscv dmi_read  0x11          ;# dmstatus
#   > riscv dmi_write 0x10 0x1      ;# dmcontrol.dmactive = 1
#   > riscv dmi_write 0x38 0x140000 ;# sbcs: 32-bit access, read-on-address
#   > riscv dmi_write 0x39 0x90400000  ;# sbaddress0 - triggers a read
#   > riscv dmi_read  0x3c          ;# sbdata0
#
# which reads the first word of the Linux kernel out of SDRAM on a running
# machine. Set sbcs bit 16 (autoincrement) and bit 15 (read-on-data) and every
# further read of 0x3c walks upward, which is how a region gets dumped.

adapter driver ftdi
adapter speed 1000

# An FT2232H breakout. Change the VID/PID and the layout to match yours; the
# only thing this file is opinionated about is what is on the other end.
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b

# The IDCODE in rtl/debug/jtag_tap.v.
#
#   [31:28] version 1   [27:12] part 0x5256 ("RV")
#   [11:1]  0x7FF - the JEDEC "unassigned" manufacturer code, which is the
#           honest answer for a project with no JEDEC membership
#   [0]     1, as the standard requires
#
# irlen 5, matching the TAP's instruction register.
jtag newtap vernier cpu -irlen 5 -expected-id 0x15256fff

# No target is declared on purpose. `target create ... riscv` would give
# OpenOCD a hart it cannot halt, and the resulting timeouts read as a broken
# adapter rather than as a Debug Module that says plainly it has no hart
# control. Declare one when abstract commands exist.

init
scan_chain
