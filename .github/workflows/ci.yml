# Continuous integration for Vernier-RV32.
#
# Split into jobs by what each one needs installed, so a failure names the
# layer rather than "CI is red". They run in parallel; `rtl` is the fastest
# thing that can fail and needs nothing but Icarus Verilog.
#
# What is NOT here, and why:
#
#   cosim   needs Spike, which has to be built from source (several minutes)
#           and would dominate the run. It is a local gate - see
#           CONTRIBUTING.md - not a CI one.
#   FPGA    synthesis needs YosysHQ's oss-cad-suite for nextpnr-ecp5, and
#           place-and-route is 4-11 minutes on an ECP5. Timing numbers are
#           recorded by hand in fpga/README.md from a real run.
#
# Every job carries `timeout-minutes`. A run on PR #9 sat in `apt-get` for two
# hours and fifteen minutes across three jobs before anyone noticed, because
# the default job timeout is six hours and apt's default behaviour against a
# dead mirror is to wait rather than give up. The budgets below are roughly
# double each job's observed runtime, so a real slowdown still passes and a
# hang fails while someone is still looking. See .github/actions/iverilog.
#
# See docs/practices.md for what these layers are each meant to catch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# `shell: bash` is not cosmetic. Without it GitHub runs steps as `bash -e`,
# where `make foo | tee foo.log` reports tee's exit status and a failing make
# looks green - which is exactly what happened to the formal job: "Bounded
# model checking" passed while make had exited 2, and only the grep after it
# noticed. Naming the shell gets `bash -eo pipefail`.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Pure RTL: no RISC-V toolchain involved at all.
  #
  # sim's testbench is hand-assembled and sim_video/sim_cmd0 are RTL-only,
  # so this job has no firmware to build. It is the one that should stay
  # green even if the toolchain situation changes underneath us.
  # ---------------------------------------------------------------------
  rtl:
    name: RTL (no toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/iverilog

      # Both cores. rtl/top.v is the only top level with a zero-latency
      # memory, which makes it the one place the fetch port is not the
      # constraint - so it is worth running against the wide core even
      # though the SoC jobs below cover it more thoroughly.
      - name: Core regression, in-order core
        run: make sim CORE=inorder | tee sim.log
      - name: Check in-order verdict
        run: grep -q "TEST PASSED" sim.log

      - name: Core regression, wide core
        run: rm -f sim/*.out && make sim CORE=ooo | tee sim_ooo.log
      - name: Check wide-core verdict
        run: grep -q "TEST PASSED" sim_ooo.log

      - name: Framebuffer scan-out
        run: make sim_video | tee video.log
      - name: Check video verdict
        run: grep -q "VIDEO TEST PASSED" video.log

      - name: SD CMD0 probe against the card model
        run: make sim_cmd0 | tee cmd0.log
      - name: Check CMD0 probe verdict
        run: grep -q "CMD0 PROBE TEST PASSED" cmd0.log

      # The SDRAM controller against sim/sdram_model.v. It belongs in this
      # job rather than the firmware one because it needs no RISC-V toolchain
      # at all - it is Wishbone transactions driven from a testbench - and
      # this is the job that stays green when the toolchain situation changes
      # underneath us. The model refuses illegal protocol outright, so this
      # step also covers tRCD, tRP, tRC, tRFC, the refresh interval and burst
      # containment without the log mentioning them.
      - name: SDRAM controller against the SDRAM model
        run: make sim_sdram | tee sdram.log
      - name: Check SDRAM controller verdict
        run: grep -q "SDRAM TEST PASSED" sdram.log

      # The hardware probe (fpga/ulx3s_sdram.v), simulated. It is a bring-up
      # instrument that reports through five LEDs on a board nobody can
      # single-step, so the one thing it must not be is itself wrong - a
      # broken probe turns "the memory does not work" into a hunt through the
      # memory, the pinout and the clock when the fault is in the instrument.
      - name: SDRAM hardware probe, in simulation
        run: make sim_sdramprobe | tee sdramprobe.log
      - name: Check probe verdict
        run: grep -q "SDRAM PROBE TEST PASSED" sdramprobe.log

  # ---------------------------------------------------------------------
  # Everything that needs firmware built.
  #
  # The toolchain install lives in .github/actions/riscv-toolchain, shared
  # with the isa job below - one place to pin, one place to fix.
  #
  # ubuntu-24.04 rather than ubuntu-latest, deliberately: the toolchain asset
  # is built for a specific Ubuntu, and pinning the runner keeps the two from
  # drifting apart when GitHub rolls the `latest` label forward.
  #
  # Matrixed over both cores. Until now every job here built
  # rtl/cpu_core.v and nothing built rtl/ooo/core_ooo.v, so the wide core -
  # which by then had a fetch buffer, dual issue and a store buffer that the
  # proven core does not - was gated only by whatever a contributor ran
  # locally. `CORE` is read from the environment because the Makefile
  # declares it with `?=`, which yields to an environment value.
  # ---------------------------------------------------------------------
  firmware:
    name: SoC, firmware and traps (${{ matrix.core }})
    runs-on: ubuntu-24.04
    # Raised from 30 when the SDRAM boot test landed: that run is 2.2 M
    # cycles of full-SoC simulation on its own, and the wide core's leg of
    # this job was already at 21 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        core: [inorder, ooo]
    env:
      CORE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/iverilog

      - uses: ./.github/actions/riscv-toolchain

      # sim/program.hex is committed so the rtl job needs no toolchain; this
      # is where it gets proved to still match its source.
      - name: Core regression program matches its source
        run: make check-program

      - name: Build boot ROM, SoC program and images
        run: make soc ramimage probeimage

      - name: SoC over the SD boot path
        run: make sim_soc | tee soc.log
      - name: Check SoC verdict
        run: grep -q "SOC TEST PASSED" soc.log

      # The board's own configuration: program preloaded, 64 KB of RAM.
      # practices.md §4 - sim_soc runs a machine no board has.
      - name: SoC on the board's preloaded path (64 KB)
        run: make sim_ramboot | tee ramboot.log
      - name: Check preloaded-path verdict
        run: grep -q "RAMBOOT TEST PASSED" ramboot.log

      # practices.md §5 - reset is not a fresh start. This is the regression
      # test for the .data initialisation bug.
      - name: Survives a reset (run twice, RAM untouched)
        run: make sim_rerun

      - name: Trap handler calibration
        run: make trapcheck

      - name: Board wrapper wiring
        run: make sim_ulx3s | tee ulx3s.log
      - name: Check wrapper verdict
        run: grep -q "ULX3S WRAPPER TEST PASSED" ulx3s.log

      - name: Flat (non-SoC) software build and run
        run: make sim_software

      # docs/roadmap.md Phase 2: the SoC executing a 99 KB program out of
      # external SDRAM, with block RAM present but holding nothing but the
      # verdict word. Matrixed over both cores like everything else here -
      # the fetch path through the instruction cache to a slave that takes
      # eight cycles to answer is not the same test on the two of them.
      - name: SoC running from external SDRAM
        run: make sim_sdramboot | tee sdramboot.log
      - name: Check SDRAM boot verdict
        run: grep -q "SDRAMBOOT TEST PASSED" sdramboot.log

      # The image `BOARD=ulx3s85-sdramcheck` bakes into a bitstream, run in
      # the configuration the board has: 64 KB of block RAM, program preloaded,
      # SDRAM behind the window it hammers. Gated here so the thing that gets
      # flashed is the thing that was tested.
      - name: SDRAM checked from block RAM (the board's bitstream image)
        run: make sim_sdramcheck | tee sdramcheck.log
      - name: Check SDRAM check verdict
        run: grep -q "RAMBOOT TEST PASSED" sdramcheck.log

      # The boot ROM's UART loader, end to end: a host sends a program over
      # the serial line and the SoC runs it out of external SDRAM. This is the
      # only way a program gets there on a board - a bitstream initialises
      # block RAM at configuration time and SDRAM comes up empty - so it is
      # also the only test that covers rtl/uart.v's *receive* path, which had
      # no user at all before this loader existed.
      - name: Boot ROM UART loader
        run: make sim_uartload | tee uartload.log
      - name: Check UART loader verdict
        run: grep -q "UARTLOAD TEST PASSED" uartload.log

  # ---------------------------------------------------------------------
  # Architectural tests: somebody else's suite, pinned to a commit.
  # ---------------------------------------------------------------------
  isa:
    name: riscv-tests (${{ matrix.core }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        core: [inorder, ooo]
    env:
      CORE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/iverilog

      - uses: ./.github/actions/riscv-toolchain

      - name: Fetch the suite (pinned commit)
        run: make isa-fetch

      - name: Run the architectural tests
        run: make isa | tee isa.log

      # run.sh already fails on a regression *and* on an expected failure
      # that starts passing, so the list in expected-failures.txt cannot go
      # stale. This asserts the summary line as well.
      - name: Check no failures
        run: |
          grep -qE "riscv-tests: [0-9]+ passed, 0 failed" isa.log

  # ---------------------------------------------------------------------
  # CoreMark, as a correctness gate rather than a stopwatch.
  #
  # This exists because of a specific incident. Stage 1d's load-completion
  # buffer shipped with a missing hazard check: deferring released a stall
  # that let a dual-issue pair be latched, and only the pair's older half was
  # checked against the outstanding load. The younger half read the load's
  # address instead of its data.
  #
  # Every layer above stayed green. riscv-tests co-simulated 82/82 against
  # Spike with the bug present, because the hazard needs a load followed by a
  # pair whose younger half depends on it, and 82 hand-written architectural
  # tests contain far less pointer-chasing than one real program. CoreMark's
  # list and state passes hit it within a few thousand instructions and its
  # own CRCs caught it - and CoreMark was not run by CI at all.
  #
  # So it is here, matrixed over both cores like the suites it complements.
  # It is checked for its verdict, not its cycle count: the number is printed
  # in the log for whoever wants it, but asserting on it would turn every
  # microarchitecture change into a CI edit and every environment difference
  # into a false failure.
  #
  # Cost is two legs of roughly ten minutes, in parallel with the rest.
  # docs/practices.md section 15: this is a layer that answers a question the
  # others demonstrably cannot.
  # ---------------------------------------------------------------------
  coremark:
    name: CoreMark CRCs (${{ matrix.core }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        core: [inorder, ooo]
    env:
      CORE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/iverilog

      - uses: ./.github/actions/riscv-toolchain

      - name: Fetch CoreMark (pinned commit)
        run: make coremark-fetch

      - name: Run CoreMark
        run: make coremark | tee coremark.log

      # CoreMark validates its own list/matrix/state CRCs against values the
      # benchmark computes independently of this core. `BENCHMARK PASSED` is
      # printed only when it validated; the `ERROR!` check is belt and braces,
      # since that is the line the failing build actually printed
      # ("[0]ERROR! list crc 0x9a29 - should be 0xe714").
      - name: Check CoreMark validated its own results
        run: |
          grep -q "BENCHMARK PASSED" coremark.log
          if grep -q "ERROR!" coremark.log; then
            echo "CoreMark reported a CRC mismatch:"
            grep "ERROR!" coremark.log
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Formal: bounded model checking. No RISC-V toolchain needed.
  # ---------------------------------------------------------------------
  formal:
    name: Formal (yosys + z3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/oss-cad-suite

      - name: Bounded model checking
        run: make formal | tee formal.log

      # formal/fv_selftest.v is a property that MUST fail. If the summary
      # ever shows 0 refuted *and* the selftest as proved, the flow has
      # stopped being able to go red - which is the failure mode that makes
      # every other proof here worthless.
      - name: Check the proofs held
        run: |
          grep -qE "formal: [0-9]+ proved, 0 refuted" formal.log
