# Continuous integration for Vernier-RV32.
#
# Split into jobs by what each one needs installed, so a failure names the
# layer rather than "CI is red". They run in parallel; `rtl` is the fastest
# thing that can fail and needs nothing but Icarus Verilog.
#
# What is NOT here, and why:
#
#   cosim   needs Spike, which has to be built from source (several minutes)
#           and would dominate the run. It is a local gate - see
#           CONTRIBUTING.md - not a CI one.
#   FPGA    synthesis needs YosysHQ's oss-cad-suite for nextpnr-ecp5, and
#           place-and-route is 4-11 minutes on an ECP5. Timing numbers are
#           recorded by hand in fpga/README.md from a real run.
#
# Every job carries `timeout-minutes`. A run on PR #9 sat in `apt-get` for two
# hours and fifteen minutes across three jobs before anyone noticed, because
# the default job timeout is six hours and apt's default behaviour against a
# dead mirror is to wait rather than give up. The budgets below are roughly
# double each job's observed runtime, so a real slowdown still passes and a
# hang fails while someone is still looking. See .github/actions/iverilog.
#
# See docs/practices.md for what these layers are each meant to catch.
name: CI

# Pull requests only. A merge to main used to run the whole workflow again on
# the same tree the pull request had just passed, which cost the same hour of
# runner time and could only repeat the answer. A run on main is still one click
# away (workflow_dispatch) when a merge needs checking by itself.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# `shell: bash` is not cosmetic. Without it GitHub runs steps as `bash -e`,
# where `make foo | tee foo.log` reports tee's exit status and a failing make
# looks green - which is exactly what happened to the formal job: "Bounded
# model checking" passed while make had exited 2, and only the grep after it
# noticed. Naming the shell gets `bash -eo pipefail`.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Pure RTL: no RISC-V toolchain involved at all.
  #
  # sim's testbench is hand-assembled and sim_video/sim_cmd0 are RTL-only,
  # so this job has no firmware to build. It is the one that should stay
  # green even if the toolchain situation changes underneath us.
  # ---------------------------------------------------------------------
  rtl:
    name: RTL (no toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/iverilog

      # Both cores. rtl/top.v is the only top level with a zero-latency
      # memory, which makes it the one place the fetch port is not the
      # constraint - so it is worth running against the wide core even
      # though the SoC jobs below cover it more thoroughly.
      - name: Core regression, in-order core
        run: make sim CORE=inorder | tee sim.log
      - name: Check in-order verdict
        run: grep -q "TEST PASSED" sim.log

      - name: Core regression, wide core
        run: rm -f sim/*.out && make sim CORE=ooo | tee sim_ooo.log
      - name: Check wide-core verdict
        run: grep -q "TEST PASSED" sim_ooo.log

      - name: Framebuffer scan-out
        run: make sim_video | tee video.log
      - name: Check video verdict
        run: grep -q "VIDEO TEST PASSED" video.log

      - name: SD CMD0 probe against the card model
        run: make sim_cmd0 | tee cmd0.log
      - name: Check CMD0 probe verdict
        run: grep -q "CMD0 PROBE TEST PASSED" cmd0.log

      # The SDRAM controller against sim/sdram_model.v. It belongs in this
      # job rather than the firmware one because it needs no RISC-V toolchain
      # at all - it is Wishbone transactions driven from a testbench - and
      # this is the job that stays green when the toolchain situation changes
      # underneath us. The model refuses illegal protocol outright, so this
      # step also covers tRCD, tRP, tRC, tRFC, the refresh interval and burst
      # containment without the log mentioning them.
      # The UART loader's *host* half, against a fake board on a pty. Needs
      # nothing but python3 - no toolchain, no simulator - and it is the only
      # thing that tests software/soc/uartload.py, which is what somebody at a
      # bench is actually running when they find out whether the loader works.
      - name: UART loader host script
        run: make uartload-host | tee uartloadhost.log
      - name: Check host script verdict
        run: grep -q "UARTLOAD HOST TEST PASSED" uartloadhost.log

      - name: SDRAM controller against the SDRAM model
        run: make sim_sdram | tee sdram.log
      - name: Check SDRAM controller verdict
        run: grep -q "SDRAM TEST PASSED" sdram.log

      # The hardware probe (fpga/ulx3s_sdram.v), simulated. It is a bring-up
      # instrument that reports through five LEDs on a board nobody can
      # single-step, so the one thing it must not be is itself wrong - a
      # broken probe turns "the memory does not work" into a hunt through the
      # memory, the pinout and the clock when the fault is in the instrument.
      - name: SDRAM hardware probe, in simulation
        run: make sim_sdramprobe | tee sdramprobe.log
      - name: Check probe verdict
        run: grep -q "SDRAM PROBE TEST PASSED" sdramprobe.log

      # The Phase 8 packet network (docs/roadmap/phase-08-noc.md), unit by unit: the
      # interfaces, the routers, the router fabric against the bus on random traffic,
      # its latency stage by stage, a four-word burst carried over the bus and over the
      # network to the real SDRAM controller, and the data cache's snoop against the late
      # acknowledgement that only a router fabric can produce. Pure RTL and a dozen
      # seconds in all, and until this step nothing here ran any of it: the whole network
      # was gated only by whatever a contributor ran locally. `make noc_check_sim` is the
      # one place the list lives, and `make verify` runs it too. -k so that every failing
      # test is reported, not just the first; each test checks its own verdict and fails
      # the target when it is missing.
      - name: Phase 8 network, unit and fabric simulations
        run: make -k noc_check_sim

  # ---------------------------------------------------------------------
  # Everything that needs firmware built.
  #
  # The toolchain install lives in .github/actions/riscv-toolchain, shared
  # with the isa job below - one place to pin, one place to fix.
  #
  # ubuntu-24.04 rather than ubuntu-latest, deliberately: the toolchain asset
  # is built for a specific Ubuntu, and pinning the runner keeps the two from
  # drifting apart when GitHub rolls the `latest` label forward.
  #
  # Matrixed over both cores. Until now every job here built
  # rtl/cpu_core.v and nothing built rtl/ooo/core_ooo.v, so the wide core -
  # which by then had a fetch buffer, dual issue and a store buffer that the
  # proven core does not - was gated only by whatever a contributor ran
  # locally. `CORE` is read from the environment because the Makefile
  # declares it with `?=`, which yields to an environment value.
  # ---------------------------------------------------------------------
  firmware:
    name: SoC, firmware and traps (${{ matrix.core }})
    runs-on: ubuntu-24.04
    # Raised from 30 when the SDRAM boot test landed: that run is 2.2 M
    # cycles of full-SoC simulation on its own, and the wide core's leg of
    # this job was already at 21 minutes. Briefly raised again, 45 to 60,
    # while stage 1d's out-of-order load port could speculatively lose a
    # real UART byte (docs/roadmap/phase-01-superscalar-ooo.md, "Stage 1d was built anyway"): the
    # wide core's UART loader test spent real wall-clock minutes reaching
    # sim/tb_uartload.v's own hang-detection watchdog before it could fail,
    # a cost a passing run never paid. Back to 45, then, once that bug was
    # fixed.
    #
    # Raised again, 45 to 90, when sim_uartirq/sim_probe/sim_div64test were
    # added to this job (docs/roadmap/index.md's "Known defects" - they existed
    # and passed already, just were never gated in CI). Measured directly on
    # a real run, not estimated: `CORE=inorder` passed at 44m53s - seven
    # seconds under the old 45-minute budget - and `CORE=ooo` was still
    # inside sim_div64test's phase 2 (of 3) when GitHub Actions killed it at
    # 45m14s. div64test's 400-round phase 2 alone ran for over 20 minutes on
    # this runner without finishing, against well under 10 minutes for the
    # same three targets, both cores, on a local machine - this job's actual
    # bottleneck is GitHub's runner being slow at single-threaded Icarus
    # simulation on the wider core's design, not anything specific to this
    # test. 90 follows this file's own "roughly double each job's observed
    # runtime" rule from the ooo leg's measured (partial, still-climbing)
    # time rather than guessing at a number.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        core: [inorder, ooo]
    env:
      CORE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/iverilog

      - uses: ./.github/actions/verilator

      - uses: ./.github/actions/riscv-toolchain

      # The boot ROM has embedded this project's own dts/soc_$(CORE).dtb
      # since the device-tree hand-off change (docs/roadmap/phase-13-multicore.md's Phase 13,
      # Stage 13) - `make soc` below now reaches `make dtb`, which this job
      # never needed dtc for before.
      - uses: ./.github/actions/dtc

      # sim/program.hex is committed so the rtl job needs no toolchain; this
      # is where it gets proved to still match its source.
      - name: Core regression program matches its source
        run: make check-program

      - name: Build boot ROM, SoC program and images
        run: make soc ramimage probeimage

      - name: SoC over the SD boot path
        run: make sim_soc | tee soc.log
      - name: Check SoC verdict
        run: grep -q "SOC TEST PASSED" soc.log

      # The board's own configuration: program preloaded, 64 KB of RAM.
      # practices.md §4 - sim_soc runs a machine no board has.
      - name: SoC on the board's preloaded path (64 KB)
        run: make sim_ramboot | tee ramboot.log
      - name: Check preloaded-path verdict
        run: grep -q "RAMBOOT TEST PASSED" ramboot.log

      # practices.md §5 - reset is not a fresh start. This is the regression
      # test for the .data initialisation bug.
      - name: Survives a reset (run twice, RAM untouched)
        run: make sim_rerun

      - name: Trap handler calibration
        run: make trapcheck

      - name: Board wrapper wiring
        run: make sim_ulx3s | tee ulx3s.log
      - name: Check wrapper verdict
        run: grep -q "ULX3S WRAPPER TEST PASSED" ulx3s.log

      - name: Flat (non-SoC) software build and run
        run: make sim_software

      # The newlib probe: which rung of libc actually works, preloaded the
      # same way sim_ramboot is. Existed in `make verify` already but was
      # never wired into CI - docs/roadmap/index.md's "Known defects" named this
      # gap explicitly: a regression here would have shown every check
      # above green.
      - name: newlib probe
        run: make sim_probe | tee probe.log
      - name: Check probe verdict
        run: grep -q "RAMBOOT TEST PASSED" probe.log

      # docs/roadmap/phase-02-memory-ceiling.md Phase 2: the SoC executing a 99 KB program out of
      # external SDRAM, with block RAM present but holding nothing but the
      # verdict word. Matrixed over both cores like everything else here -
      # the fetch path through the instruction cache to a slave that takes
      # eight cycles to answer is not the same test on the two of them.
      - name: SoC running from external SDRAM
        run: make sim_sdramboot | tee sdramboot.log
      - name: Check SDRAM boot verdict
        run: grep -q "SDRAMBOOT TEST PASSED" sdramboot.log

      # The same run, same image, same core, under the other simulator - and
      # then the two are required to agree on the cycle count, the refresh
      # count and every byte the program printed.
      #
      # This is what makes the Verilator harness trustworthy enough to debug
      # the Linux bring-up in, where it will be the only practical way to run
      # 10^8 cycles. "Both said PASS" would not be enough: two quite different
      # machines can both finish a self-checking program. Matching cycle
      # counts mean the C++ SDRAM model returns read data on the same edges
      # sim/sdram_model.v returns it on.
      #
      # Both this and `make verilator_check` compare against the Icarus run
      # that has already happened rather than repeating it - that run is
      # three minutes. The difference is only that make can express the
      # dependency and a workflow step cannot, so the log is named here.
      - name: The same run under Verilator
        run: |
          make verilator_sdramboot \
            VERILATOR_PLUSARGS="+checkreads +checkfetch +checkdecode +checkmmu +checkuart" \
            | tee verilator.log
      - name: Both simulators agree, cycle for cycle
        run: python3 sim/verilator_compare.py sdramboot.log verilator.log

      # The self-checking probes, which this step did not carry until a device
      # tree claiming a FIFO the UART has not got made it obvious they were
      # only ever running in someone's local `make verify`. They cost nothing
      # here - the whole run is half a second - and each prints its count in
      # double asterisks when it disagrees with its model, which is the one
      # thing to grep for. See docs/practices.md sections 30-32.
      - name: Nothing the probes checked disagreed with its model
        run: |
          if grep -a '\*\*' verilator.log; then
            echo "FAILED: a self-checking probe disagreed - see above"
            exit 1
          fi

      # The image `BOARD=ulx3s85-sdramcheck` bakes into a bitstream, run in
      # the configuration the board has: 64 KB of block RAM, program preloaded,
      # SDRAM behind the window it hammers. Gated here so the thing that gets
      # flashed is the thing that was tested.
      # Four pins to a bus master. No toolchain needed - the block RAM image
      # is a generated pattern rather than a compiled program - so this runs
      # on the bare runner alongside the rest.
      - name: JTAG debug path
        run: make sim_jtag | tee jtag.log
      - name: Check JTAG verdict
        run: grep -aq "JTAG TEST PASSED" jtag.log

      - name: SDRAM checked from block RAM (the board's bitstream image)
        run: make sim_sdramcheck | tee sdramcheck.log
      - name: Check SDRAM check verdict
        run: grep -q "RAMBOOT TEST PASSED" sdramcheck.log

      # docs/roadmap/phase-05-third-party-software.md Phase 5: Sv32 page tables living in external SDRAM,
      # walked from S-mode, with the root table above the old 16 MB decode
      # ceiling. Two RTL changes make it possible - the walkers became a bus
      # master (rtl/soc/wb_ptw.v) and the interconnect decode grew a per-slave
      # mask - and it is the first test in this repository that ever turns
      # instruction-fetch translation on: riscv-tests' rv32si suite is the
      # `-p` (physical) variant and never does. It found two core bugs on its
      # first run, both of which had been reachable since the MMU landed.
      - name: Sv32 with page tables in SDRAM
        run: make sim_mmusdram | tee mmusdram.log
      - name: Check Sv32-in-SDRAM verdict
        run: grep -q "RAMBOOT TEST PASSED" mmusdram.log

      # The PLIC's standard register map and an external interrupt actually
      # delivered to S-mode through context 1 - the first program here that
      # ever takes an external interrupt, in either privilege mode.
      - name: PLIC standard layout and S-mode delivery
        run: make sim_plic | tee plic.log
      - name: Check PLIC verdict
        run: grep -q "RAMBOOT TEST PASSED" plic.log

      # The ns16550 surface a driver touches that no program here did: DLAB,
      # the divisor latch, IIR, MSR, and the UART's interrupt arriving through
      # PLIC source 1. It found a wedged-transmitter bug on its first run.
      - name: ns16550 register map and interrupt
        run: make sim_uart16550 | tee uart16550.log
      - name: Check ns16550 verdict
        run: grep -q "RAMBOOT TEST PASSED" uart16550.log

      # An interrupt-driven UART TX driver, not the polled one everything
      # above uses - and, like sim_probe below, in `make verify` already but
      # never wired into CI (docs/roadmap/index.md's "Known defects").
      - name: Interrupt-driven UART TX driver
        run: make sim_uartirq | tee uartirq.log
      - name: Check UART IRQ verdict
        run: grep -q "RAMBOOT TEST PASSED" uartirq.log

      # __div64_32, isolated - docs/roadmap/phase-01-superscalar-ooo.md's "Stage 1d was built anyway"
      # section has the story: CORE=ooo was once found permanently stuck
      # inside this exact kernel routine, and this is the fast, deterministic
      # regression for it, without a 90-million-cycle Linux boot in the way.
      # Also in `make verify` already but never wired into CI.
      - name: __div64_32, isolated
        run: make sim_div64test | tee div64test.log
      - name: Check div64 verdict
        run: grep -q "RAMBOOT TEST PASSED" div64test.log

      # The boot ROM's UART loader, end to end: a host sends a program over
      # the serial line and the SoC runs it out of external SDRAM. This is the
      # only way a program gets there on a board - a bitstream initialises
      # block RAM at configuration time and SDRAM comes up empty - so it is
      # also the only test that covers rtl/uart.v's *receive* path, which had
      # no user at all before this loader existed.
      - name: Boot ROM UART loader
        run: make sim_uartload | tee uartload.log
      # An ordinary hard pass requirement, both cores. The wide core carried
      # a known, deliberate, documented gap here for a while - a speculative
      # out-of-order load could dequeue a real byte from the UART's receive
      # register before an older branch's misprediction was discovered, so
      # the boot ROM waited forever for a byte that already arrived and was
      # lost - and this step was briefly split per-core, checking for that
      # exact failure line on `CORE=ooo` rather than requiring PASS. Fixed
      # (docs/roadmap/phase-01-superscalar-ooo.md, "Stage 1d was built anyway"; the out-of-order
      # load-issue scan now excludes side-effecting addresses the same way
      # `cpu_wb.v`'s D-cache already does), so back to one check for both.
      - name: Check UART loader verdict
        run: grep -q "UARTLOAD TEST PASSED" uartload.log

      # Four harts on the shared bus (Phase 8 Part 34, docs/roadmap/phase-08-noc.md): amoadd, a
      # lock, LR/SC, a token round the harts' caches and reservations held by every hart but one,
      # with the shared data in block RAM and in SDRAM. Every multi-hart test before it ran two,
      # and a design that is right for a pair has not been shown right for four: a mutant of the
      # reservation monitor that ignores harts 2 and 3 passes every two-hart test and fails this.
      # Seconds. -k so that every failing test is reported, not just the first.
      - name: Four harts over the bus
        run: make -k sim_soc_4hart sim_soc_4hart_sdram

  # ---------------------------------------------------------------------
  # Architectural tests: somebody else's suite, pinned to a commit.
  # ---------------------------------------------------------------------
  isa:
    name: riscv-tests (${{ matrix.core }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        core: [inorder, ooo]
    env:
      CORE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/iverilog

      - uses: ./.github/actions/riscv-toolchain

      - name: Fetch the suite (pinned commit)
        run: make isa-fetch

      - name: Run the architectural tests
        run: make isa | tee isa.log

      # run.sh already fails on a regression *and* on an expected failure
      # that starts passing, so the list in expected-failures.txt cannot go
      # stale. This asserts the summary line as well.
      - name: Check no failures
        run: |
          grep -qE "riscv-tests: [0-9]+ passed, 0 failed" isa.log

  # ---------------------------------------------------------------------
  # CoreMark, as a correctness gate rather than a stopwatch.
  #
  # This exists because of a specific incident. Stage 1d's load-completion
  # buffer shipped with a missing hazard check: deferring released a stall
  # that let a dual-issue pair be latched, and only the pair's older half was
  # checked against the outstanding load. The younger half read the load's
  # address instead of its data.
  #
  # Every layer above stayed green. riscv-tests co-simulated 82/82 against
  # Spike with the bug present, because the hazard needs a load followed by a
  # pair whose younger half depends on it, and 82 hand-written architectural
  # tests contain far less pointer-chasing than one real program. CoreMark's
  # list and state passes hit it within a few thousand instructions and its
  # own CRCs caught it - and CoreMark was not run by CI at all.
  #
  # So it is here, matrixed over both cores like the suites it complements.
  # It is checked for its verdict, not its cycle count: the number is printed
  # in the log for whoever wants it, but asserting on it would turn every
  # microarchitecture change into a CI edit and every environment difference
  # into a false failure.
  #
  # Cost is two legs of roughly ten minutes, in parallel with the rest.
  # docs/practices.md section 15: this is a layer that answers a question the
  # others demonstrably cannot.
  # ---------------------------------------------------------------------
  coremark:
    name: CoreMark CRCs (${{ matrix.core }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        core: [inorder, ooo]
    env:
      CORE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/iverilog

      - uses: ./.github/actions/riscv-toolchain

      - name: Fetch CoreMark (pinned commit)
        run: make coremark-fetch

      - name: Run CoreMark
        run: make coremark | tee coremark.log

      # CoreMark validates its own list/matrix/state CRCs against values the
      # benchmark computes independently of this core. `BENCHMARK PASSED` is
      # printed only when it validated; the `ERROR!` check is belt and braces,
      # since that is the line the failing build actually printed
      # ("[0]ERROR! list crc 0x9a29 - should be 0xe714").
      - name: Check CoreMark validated its own results
        run: |
          grep -q "BENCHMARK PASSED" coremark.log
          if grep -q "ERROR!" coremark.log; then
            echo "CoreMark reported a CRC mismatch:"
            grep "ERROR!" coremark.log
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Dual-hart CoreMark (Phase 15 Stage 5, docs/roadmap/phase-15-heterogeneous.md): both harts run
  # CoreMark concurrently, not one after the other, checking a shared
  # counter's own read-modify-store comes out at exactly 2x the iteration
  # count - a real cross-hart-atomicity proof (see sim/tb_soc_2hart_coremark.v
  # and software/bench/core_portme.c's own COREMARK_DUAL_HART block), not
  # merely a repeat of the single-hart job above.
  #
  # A separate job from `coremark` above, not a third leg matrixed into it:
  # this is genuinely new infrastructure (a shared reset-vector dispatcher,
  # two independently-linked images, a console lock), heavier than the
  # single-hart run, and matrixed over all three CORE values including the
  # mixed pair - the same "a real job of its own, run in parallel rather
  # than serialized into anything else's critical path" reasoning the
  # existing `coremark` job already gives for its own separation from `rtl`.
  # ---------------------------------------------------------------------
  coremark-2hart:
    name: Dual-hart CoreMark (concurrent, CORE=${{ matrix.core }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        core: [inorder, ooo, hetero]
    env:
      CORE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/iverilog

      - uses: ./.github/actions/riscv-toolchain

      - name: Fetch CoreMark (pinned commit)
        run: make coremark-fetch

      - name: Run concurrent dual-hart CoreMark
        run: make sim_soc_2hart_coremark | tee soc_2hart_coremark.log

      - name: Check both harts validated their own results
        run: |
          grep -q "SOC-2HART-COREMARK: PASS" soc_2hart_coremark.log
          if grep -q "ERROR!" soc_2hart_coremark.log; then
            echo "A hart's CoreMark reported a CRC mismatch or wrong-image dispatch:"
            grep "ERROR!" soc_2hart_coremark.log
            exit 1
          fi

  # ---------------------------------------------------------------------
  # The SoC over the Phase 8 router fabric (docs/roadmap/phase-08-noc.md), in the bus's
  # place: INTERCONNECT=xbar, both cores.
  #
  # The unit simulations in the `rtl` job drive the fabric from testbenches, so they
  # cannot see what only software on a whole SoC does to it. A mutation test says which
  # steps below are the ones that can: tying off the AMO read-lock in soc_top.v's fabric
  # build passes every unit simulation and fails `sim_soc_2hart_amoswap` (block RAM and
  # SDRAM) over the fabric. The converse holds too: the cache's late-ack guard
  # (rtl/soc/cpu_wb.v's SNOOP_LATE_ACK) is what `sim_cpu_wb_snoop_race` in the `rtl` job
  # tests, and switching it off in the fabric build leaves every two-hart SoC test green,
  # which is why `sim_soc_2hart` now asserts that the build has it on. The rest is the
  # fabric under real software: the cache line fills of the two boots, the SDRAM one
  # reading its code through four-word bursts, and interrupts and MMIO across it. This is
  # the part of `make verify_xbar` that is cheap and specific to the fabric. The rest of
  # it (the Linux boots, which need an image CI does not have, the riscv-tests and the
  # Spike co-simulation) is the same software on the same cores as the bus's jobs, and
  # stays a local gate.
  #
  # Measured on a local machine, in-order core, over the fabric: the nine two-hart
  # tests 1 to 9 seconds each, the PLIC, UART and Sv32 tests 14 to 26 seconds, the
  # preloaded-path boot 5.6 minutes and the SDRAM boot 10. On this runner, in the first
  # run (PR #249), the job took 25.9 minutes on the in-order core and 25.6 on the wide
  # one: the two-hart tests 34 and 43 seconds, the device tests 82 and 91, the
  # preloaded-path boot 503 and 460, the SDRAM boot 911 and 913. That is about 1.3 times
  # a local machine, not the two to three the firmware job's comment records for its own
  # tests, and the budget is this file's rule of roughly double the observed time.
  # ---------------------------------------------------------------------
  noc:
    name: SoC over the router fabric (${{ matrix.core }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        core: [inorder, ooo]
    env:
      CORE: ${{ matrix.core }}
      INTERCONNECT: xbar
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/iverilog

      - uses: ./.github/actions/riscv-toolchain

      # `make soc` reaches `make dtb`; see the firmware job.
      - uses: ./.github/actions/dtc

      - name: Build boot ROM, SoC program and images
        run: make soc ramimage probeimage

      # Two harts over the fabric: the boot with the second hart released, then LR/SC,
      # AMOs, coherence and ordinary stores, in block RAM and in SDRAM. -k so that every
      # failing test is reported, not just the first.
      - name: Two harts over the fabric
        run: >-
          make -k sim_ramboot_2hart sim_soc_2hart sim_soc_2hart_lrsc sim_soc_2hart_amoswap
          sim_soc_2hart_coherence sim_soc_2hart_ordinary sim_soc_2hart_coherence_sdram
          sim_soc_2hart_lrsc_sdram sim_soc_2hart_amoswap_sdram

      # Four harts over the fabric, the same test as in the `firmware` job over the bus. It is
      # here for a reason that only four harts show: with three or more, two harts spinning on a
      # lock with AMOs keep the data inputs of the request router busy every cycle, and fixed
      # priority never lets the lock holder's instruction fetch through to run its release. The
      # routers' aging (XBAR_AGE_LIMIT, which soc_top.v turns on from three harts) is what stops
      # that, and this fails without it.
      - name: Four harts over the fabric
        run: make -k sim_soc_4hart sim_soc_4hart_sdram

      - name: Interrupts and Sv32 over the fabric
        run: make -k sim_plic sim_uartirq sim_mmusdram

      - name: SoC on the board's preloaded path over the fabric
        run: make sim_ramboot

      - name: SoC running from external SDRAM over the fabric
        run: make sim_sdramboot

  # ---------------------------------------------------------------------
  # Formal: bounded model checking. No RISC-V toolchain needed.
  # ---------------------------------------------------------------------
  formal:
    name: Formal (yosys + z3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/oss-cad-suite

      - name: Bounded model checking
        run: make formal | tee formal.log

      # formal/fv_selftest.v is a property that MUST fail. If the summary
      # ever shows 0 refuted *and* the selftest as proved, the flow has
      # stopped being able to go red - which is the failure mode that makes
      # every other proof here worthless.
      - name: Check the proofs held
        run: |
          grep -qE "formal: [0-9]+ proved, 0 refuted" formal.log

      # The DDR3 PHY's synthesis branch: elaborates every ECP5 primitive it
      # instantiates against yosys's own cell library, so a port that does not exist
      # or a width that does not match fails here. Verilator cannot do this (it has
      # no models of those cells), and no other job has yosys.
      - name: DDR3 PHY, synthesis branch elaborates
        run: make synth_check_ddr3

      # Full synthesis and place-and-route of the PHY against the ECPIX-5's device and its
      # real DDR3 pins. It is what found the DQ/DQS tri-state and read-FIFO pointer defects
      # (Part 21), which no simulation can see, and what keeps them fixed. Seconds, not the
      # minutes of the SoC's own place-and-route, and this is the job that has nextpnr.
      - name: DDR3 PHY places and routes on the ECPIX-5's device
        run: make pnr_probe_ddr3

      # The Phase 8 routers' area, each shape the fabric uses synthesised on its own and
      # held to a budget several times what they cost and several times under what one
      # mistake costs. Part 29 found the response router at 65,805 4-input LUTs, nine
      # times what it needs, because its FIFOs were one array that every input could
      # reach, in a design whose every test passed; this is what stops it coming back.
      # Needs yosys, which is why it is here and not in `rtl`.
      - name: Phase 8 routers, area budget
        run: make noc_router_area_check

  # ---------------------------------------------------------------------
  # The DDR3 PHY (Phase 9, Stage 1): every simulation test, the same tests again
  # under Verilator, and Verilator lint of the simulation branch. No RISC-V
  # toolchain. Until Part 19 nothing here ran any of it in CI - eighteen slices
  # had been gated only by whatever a contributor ran locally.
  #
  # `make ddr3_check_sim` is the one place the list of tests lives, and
  # `make verify` runs it too. The yosys half, `synth_check_ddr3`, is a step of the
  # `formal` job instead, because oss-cad-suite puts its own bundled iverilog and
  # verilator first on PATH and this job wants the apt versions the other jobs use.
  #
  # -k so that every failing test is reported, not just the first; -j because each
  # test has its own build directory and log.
  # ---------------------------------------------------------------------
  ddr3:
    name: DDR3 PHY (Icarus + Verilator)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/iverilog

      - uses: ./.github/actions/verilator

      - name: DDR3 simulation tests, Verilator runs and lint
        run: |
          set -o pipefail
          make -k -j4 ddr3_check_sim 2>&1 | tee ddr3.log

  # ---------------------------------------------------------------------
  # Bill of materials: SBOM (software) and HBOM (hardware), CycloneDX 1.5
  # JSON. No RISC-V toolchain - bom/gen_sbom.py and bom/gen_hbom.py are
  # plain Python 3, reading this project's own pinned-version files and
  # RTL directly rather than a hand-maintained list (see their own header
  # comments for why). Icarus Verilog and Verilator are installed anyway,
  # the same way the `rtl` job's own name means "no RISC-V toolchain," not
  # "no simulators" - the SBOM records their live versions, since neither
  # is pinned anywhere in this repo (docs/toolchain.md), and bom/test_bom.py
  # asserts both are actually present rather than silently omitted.
  # ---------------------------------------------------------------------
  bom:
    name: Bill of materials (SBOM + HBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/iverilog

      - uses: ./.github/actions/verilator

      # make bom's own recipe is the check: bom/test_bom.py exits nonzero
      # on any mismatch between what got generated and what the source
      # files it was generated from actually say.
      - name: Generate and check SBOM + HBOM
        run: make bom

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: bom/sbom.json

      - name: Upload HBOM
        uses: actions/upload-artifact@v7
        with:
          name: hbom
          path: bom/hbom.json

  # ---------------------------------------------------------------------
  # Documentation lint: markdownlint (structure) + Vale (prose). No RISC-V
  # toolchain, no RTL - this job exists to catch what the other jobs
  # can't: a broken internal `#anchor` link, a skipped heading level, a
  # real typo. See .markdownlint-cli2.yaml and .vale.ini for exactly what
  # each tool checks here and why - both are deliberately narrower than
  # their defaults, calibrated against this repo's own long-form prose
  # rather than a generic style guide.
  # ---------------------------------------------------------------------
  lint:
    name: Lint (markdownlint + Vale)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: markdownlint
        run: make lint-markdown

      # Vale ships as a single static binary with no package manager
      # dependency - installed directly rather than through a third-party
      # action, the same reasoning .github/actions/oss-cad-suite gives for
      # owning its own toolchain setup. Pinned and verified against a real
      # release asset (`gh api repos/errata-ai/vale/releases/tags/vX.Y.Z`),
      # not assumed from the naming convention.
      - name: Install Vale
        env:
          VALE_VERSION: 3.24.0
        run: |
          set -euo pipefail
          URL="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "Fetching $URL"
          if ! curl -fsSL --retry 3 --retry-delay 5 "$URL" -o /tmp/vale.tar.gz; then
            echo "::error::Could not download Vale ${VALE_VERSION}."
            echo "::error::Check the release still carries that asset:"
            echo "::error::  https://github.com/errata-ai/vale/releases/tag/v${VALE_VERSION}"
            exit 1
          fi
          mkdir -p /tmp/vale-bin
          tar xzf /tmp/vale.tar.gz -C /tmp/vale-bin vale
          rm -f /tmp/vale.tar.gz
          echo "/tmp/vale-bin" >> "$GITHUB_PATH"

      - name: Vale
        run: make lint-vale

  # ---------------------------------------------------------------------
  # Code quality: static analysis across all three languages this repo
  # has - RTL, C, Python - one job, three tools, each its own step so a
  # failure names which one, the same shape `lint` above uses for
  # markdownlint + Vale. No RISC-V toolchain: none of these three
  # compiles anything.
  #
  # ubuntu-24.04, pinned for a different reason than firmware/isa/coremark
  # pin it: those need the runner to match a prebuilt toolchain asset;
  # this pins it so cppcheck's apt-resolved version stays fixed rather
  # than moving whenever GitHub advances the ubuntu-latest label.
  # ---------------------------------------------------------------------
  code-quality:
    name: Code Quality (Verilator lint + cppcheck + ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verilator

      - name: Verilator lint, rtl/top.v (in-order core)
        run: make lint-rtl-flat CORE=inorder
      - name: Verilator lint, rtl/top.v (wide core)
        run: make lint-rtl-flat CORE=ooo
      - name: Verilator lint, soc_top.v (in-order core)
        run: make lint-rtl-soc CORE=inorder
      - name: Verilator lint, soc_top.v (wide core)
        run: make lint-rtl-soc CORE=ooo

      # A pinned release built from source and cached, not apt. This used to
      # be apt (ubuntu-24.04's cppcheck, asserted at 2.13.0) on the grounds
      # that nothing this project publishes depends on cppcheck's exact
      # version and a build costs real minutes. Both still hold, but apt is
      # a release frozen at the runner image's date: it was nine minor
      # versions behind, so a contributor on a current cppcheck and CI could
      # disagree about what is clean (software/soc/newlibprobe.c already
      # records a finding that exists only on 2.13.0). The build is 23
      # seconds on a laptop and is cached by version, so after the first run
      # it costs a cache restore. The version is asserted below, the same
      # "fail loud" shape the other installs here use. Bump the cache key and
      # CPPCHECK_VERSION together.
      - name: Cache cppcheck
        uses: actions/cache@v6
        with:
          path: ~/cppcheck-bin
          key: cppcheck-2.22.0-linux-x64
      - name: Install cppcheck
        env:
          CPPCHECK_VERSION: 2.22.0
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/cppcheck-bin/cppcheck" ]; then
            URL="https://github.com/danmar/cppcheck/archive/refs/tags/${CPPCHECK_VERSION}.tar.gz"
            echo "Building cppcheck from $URL"
            if ! curl -fsSL --retry 3 --retry-delay 5 "$URL" -o /tmp/cppcheck.tar.gz; then
              echo "::error::Could not download cppcheck ${CPPCHECK_VERSION}."
              echo "::error::  https://github.com/danmar/cppcheck/releases/tag/${CPPCHECK_VERSION}"
              exit 1
            fi
            mkdir -p /tmp/cppcheck-src
            tar xzf /tmp/cppcheck.tar.gz -C /tmp/cppcheck-src --strip-components=1
            make -C /tmp/cppcheck-src -j"$(nproc)" MATCHCOMPILER=yes CXXFLAGS="-O2"
            mkdir -p "$HOME/cppcheck-bin"
            cp /tmp/cppcheck-src/cppcheck "$HOME/cppcheck-bin/"
            cp -r /tmp/cppcheck-src/cfg /tmp/cppcheck-src/platforms "$HOME/cppcheck-bin/"
          fi
          echo "$HOME/cppcheck-bin" >> "$GITHUB_PATH"
          got="$("$HOME/cppcheck-bin/cppcheck" --version | awk '{print $2}')"
          if [ "$got" != "$CPPCHECK_VERSION" ]; then
            echo "::error::cppcheck is $got, expected $CPPCHECK_VERSION (docs/toolchain.md)."
            exit 1
          fi
      - name: cppcheck
        run: make lint-c

      # A pinned, single static binary from ruff's own GitHub releases -
      # the same pattern the `lint` job's own Vale install already uses,
      # not pip: ubuntu-24.04's system Python is a PEP 668 "externally
      # managed environment" and refuses a bare `pip install` outside a
      # venv, and a direct release download needs no venv/pipx workaround
      # at all. See ruff.toml for why pinning the version isn't enough on
      # its own for this particular tool.
      - name: Install ruff
        env:
          RUFF_VERSION: 0.16.10
        run: |
          set -euo pipefail
          URL="https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz"
          echo "Fetching $URL"
          if ! curl -fsSL --retry 3 --retry-delay 5 "$URL" -o /tmp/ruff.tar.gz; then
            echo "::error::Could not download ruff ${RUFF_VERSION}."
            echo "::error::Check the release still carries that asset:"
            echo "::error::  https://github.com/astral-sh/ruff/releases/tag/${RUFF_VERSION}"
            exit 1
          fi
          mkdir -p /tmp/ruff-bin
          tar xzf /tmp/ruff.tar.gz -C /tmp/ruff-bin --strip-components=1
          rm -f /tmp/ruff.tar.gz
          echo "/tmp/ruff-bin" >> "$GITHUB_PATH"
      - name: ruff
        run: make lint-py

  # ---------------------------------------------------------------------
  # RTL code coverage: line and toggle, from Verilator-instrumented builds
  # of soc_top.v running the same sdramboot image `verilator_sdramboot`
  # already proves in the `firmware` job. Report only - no threshold,
  # nothing here fails a PR on the number itself: this is RTL coverage,
  # not firmware coverage, and it answers "did this one boot path reach
  # this line/toggle," not "is this SoC adequately tested" - verify, isa
  # and cosim are what answer that.
  #
  # Two separate Verilator builds per core (--coverage-line only,
  # --coverage-toggle only), not one combined --coverage build: see the
  # Makefile's own verilator_coverage section for why (verilator_coverage
  # --filter-type, the newer way to split one combined .dat by point
  # type, does not exist on Verilator 5.020 - this job's own apt-resolved
  # version).
  #
  # This stage does NOT run riscv-tests, cosim, the MMU/PLIC/UART
  # peripheral suites, OpenSBI, or Linux - only sdramboot's own image, on
  # both cores. A "low" percentage here does not mean those paths are
  # untested; it means this one boot did not reach them.
  #
  # Matrixed over both cores, matching firmware/isa/coremark. No iverilog,
  # no dtc: this job never cross-checks against Icarus and never builds a
  # device tree, only sim/sdramimage.hex.
  #
  # timeout-minutes: recalibrated from this job's own first real CI run
  # (this PR, both legs green) rather than the local-machine estimate
  # that preceded it - CORE=inorder took ~14 min end to end,
  # CORE=ooo ~23 min, both on this job's own apt Verilator 5.020, the
  # runner that actually matters. 45 pads the slower (ooo) leg by
  # roughly double, the same margin firmware's own 90 was set from.
  # ---------------------------------------------------------------------
  coverage:
    name: Code Coverage (line + toggle, sdramboot, ${{ matrix.core }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        core: [inorder, ooo]
    env:
      CORE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verilator
      - uses: ./.github/actions/riscv-toolchain

      - name: Build the SDRAM boot image
        run: make sdramimage

      - name: Coverage-instrumented Verilator builds (line, toggle)
        run: make verilator_coverage_build

      # A functional smoke check, not the coverage gate: confirms both
      # coverage-instrumented binaries (line-only, then toggle-only) still
      # run the program correctly, a different question from how much RTL
      # either one reached. Two runs, so two PASSED lines expected.
      - name: Run sdramboot under coverage instrumentation
        run: make verilator_coverage | tee coverage_run.log
      - name: Check both runs still passed
        run: |
          n=$(grep -c "VERILATOR SOC TEST PASSED" coverage_run.log || true)
          if [ "$n" != "2" ]; then
            echo "::error::expected 2 passing runs (line, toggle), got $n"
            exit 1
          fi

      - name: Line and toggle coverage summary
        run: make verilator_coverage_report

      - name: Upload coverage data and summary
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.core }}
          path: |
            coverage_line_${{ matrix.core }}.dat
            coverage_toggle_${{ matrix.core }}.dat
            coverage_line_${{ matrix.core }}.info
            coverage_toggle_${{ matrix.core }}.info
            coverage_summary_${{ matrix.core }}.txt
