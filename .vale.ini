# Vale (prose linter) configuration.
#
# Deliberately narrow. Vale's third-party style packs (write-good,
# proselint, Google/Microsoft) are written against corporate documentation
# and flag exactly the things this project's own long-form, causally-
# reasoned prose does on purpose - passive voice, long sentences, informal
# asides. Running one of those here would either generate hundreds of
# findings against the house style on day one, or need to be immediately
# muted rule-by-rule until nothing real was left checked - neither is a
# gate worth having. This uses only Vale's own bundled base style (no
# network fetch, no `vale sync`, nothing installed beyond the `vale`
# binary) for the two checks that are unambiguously useful regardless of
# voice: real misspellings and repeated words.
#
# `Vale.Terms` (also part of the base style) is explicitly off: it enforces
# one canonical casing per vocabulary entry, and this project's own
# vocabulary genuinely needs both - "OR" the boolean operator and "or" the
# conjunction, "PID" the process ID and `pid` the struct field, `XFAIL` the
# literal string this project's own tooling prints and "xfail" the word for
# it in prose. Checked directly (see the PR that added this file): with
# Vale.Terms on, every one of those legitimate pairs became a false
# positive.
#
# .vale/styles/config/vocabularies/Vernier/accept.txt is this project's own
# technical vocabulary (RISC-V/FPGA/kernel terms Vale's general-English
# dictionary does not know) - built by running Vale.Spelling against the
# real corpus and checking every flagged word by hand, not accepted in
# bulk on faith. A few were traced to their actual usage (`netlink` is the
# Linux kernel mechanism, not a typo for `netlist`; `Intergalaktik` is the
# ULX3S board's manufacturer) before being added.
StylesPath = .vale/styles
MinAlertLevel = error
Vocab = Vernier

[*.md]
BasedOnStyles = Vale
Vale.Terms = NO
